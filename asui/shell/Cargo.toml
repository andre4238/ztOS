[package]
name = "asui-shell"
version = "0.1.0"
edition = "2021"
description = "ASUI, the A-SYSTEMS UI: home screen, app list, dock, lock screen and status bar"
license = "GPL-3.0-or-later"

[dependencies]
slint = { version = "=1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "renderer-femtovg",
] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.49.0", default-features = false }
libc = "0.2"

[build-dependencies]
slint-build = "=1.19.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
